# ─────────────────────────────────────────────────────────────────────────────
# CI/CD for n8n-pdf-tools
#
#   pull requests + main: lint, tests, image build + container smoke test
#   push to main:         semantic-release (conventional commits) → if a new version
#                         was created, build + push the image:
#                           ghcr.io/innfactory-ai/n8n-pdf-tools:<version>
#                           <GAR>/n8n-pdf-tools:<version>   (only if the GCP_* vars are set)
#
# Optional GitHub vars for Google Artifact Registry:
#   GCP_PROJECT_NUMBER, GCP_PROJECT_ID, GCP_WIF_POOL, GCP_WIF_PROVIDER,
#   GCP_SERVICE_ACCOUNT, GCP_GAR_LOCATION, GCP_GAR_REPOSITORY
# ─────────────────────────────────────────────────────────────────────────────

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write # semantic-release pushes tags + releases
  packages: write # push to GHCR
  id-token: write # GCP Workload Identity Federation

env:
  IMAGE_NAME: n8n-pdf-tools

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock pytest httpx ruff
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  smoke:
    name: Image smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: n8n-pdf-tools:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: ./scripts/smoke.sh n8n-pdf-tools:ci

  version:
    name: Create Version
    runs-on: ubuntu-latest
    needs: [test, smoke]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      version: ${{ steps.semantic-release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: go-semantic-release/action@v1
        id: semantic-release
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          changelog-generator-opt: 'emojis=true'

  docker:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: [version]
    if: needs.version.outputs.version != ''
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: gcp-auth
        if: vars.GCP_PROJECT_ID != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: >-
            projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ vars.GCP_WIF_POOL }}/providers/${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ vars.GCP_PROJECT_ID != '' && format('{0}-docker.pkg.dev/{1}/{2}/{3}', vars.GCP_GAR_LOCATION, vars.GCP_PROJECT_ID, vars.GCP_GAR_REPOSITORY, env.IMAGE_NAME) || '' }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=latest

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        if: vars.GCP_PROJECT_ID != ''
        with:
          registry: ${{ vars.GCP_GAR_LOCATION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: VERSION=${{ needs.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### n8n-pdf-tools ${{ needs.version.outputs.version }}"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
